[package]
name = "browserkit-wry"
version = "0.1.0"
edition = "2021"

[dependencies]
browserkit-types = { path = "../browserkit-types" }
# Compatibility boundary around BrowserKit's custom vendored Wry fork.
wry = { path = "../../vendor/wry" }
tao = "0.34"

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
gtk = "0.18"
